<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
  --user-bg: #1f2937; --assistant-bg: #161b22;
  --thought-bg: #0d1117; --code-bg: #1c2128;
  --green: #3fb950; --yellow: #d29922; --red: #f85149;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar { width: 300px; min-width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; transition: margin-left .3s; }
#sidebar.hidden { margin-left: -300px; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h2 { font-size: 16px; font-weight: 600; }
.file-browser { padding: 8px; overflow-y: auto; flex: 1; }
.file-category { margin-bottom: 4px; }
.file-category-header { padding: 6px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); cursor: pointer; user-select: none; }
.file-category-header:hover { color: var(--text); }
.file-items { padding-left: 8px; }
.file-item { padding: 4px 8px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--text-dim); }
.file-item:hover { background: var(--bg); color: var(--text); }
.file-item.directory { font-weight: 500; color: var(--text); cursor: default; }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
#chat-header .title { font-size: 15px; font-weight: 600; flex: 1; }
.icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; }
.icon-btn:hover { color: var(--text); background: var(--bg); }

/* Messages */
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.message { max-width: 800px; width: 100%; margin: 0 auto; }
.message.user { align-self: flex-end; }
.message.assistant { align-self: flex-start; }
.message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.message-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.message.user .message-avatar { background: var(--accent); color: #fff; }
.message.assistant .message-avatar { background: var(--green); color: #fff; }
.message-name { font-size: 12px; font-weight: 600; color: var(--text-dim); }
.message-content { padding: 10px 14px; border-radius: 8px; line-height: 1.6; font-size: 14px; overflow-wrap: break-word; }
.message.user .message-content { background: var(--user-bg); border: 1px solid var(--border); }
.message.assistant .message-content { background: var(--assistant-bg); border: 1px solid var(--border); }
.message-content p { margin-bottom: 8px; }
.message-content p:last-child { margin-bottom: 0; }
.message-content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', Consolas, monospace; }
.message-content pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.message-content pre code { background: none; padding: 0; }
.message-content ul, .message-content ol { padding-left: 20px; margin-bottom: 8px; }
.message-content h1, .message-content h2, .message-content h3 { margin: 12px 0 6px; }
.message-content a { color: var(--accent); }
.message-content blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }

/* Thought process */
.thought-process { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--thought-bg); }
.thought-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); cursor: pointer; user-select: none; }
.thought-header:hover { background: var(--bg); }
.thought-toggle { color: var(--text-dim); font-size: 12px; transition: transform .2s; }
.thought-toggle.open { transform: rotate(90deg); }
.thought-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); flex: 1; }
.thought-steps { padding: 4px 8px; }
.thought-step { padding: 4px 8px; font-size: 12px; display: flex; align-items: flex-start; gap: 8px; color: var(--text-dim); }
.thought-step.active { color: var(--accent); }
.thought-step.done { color: var(--green); }
.thought-step.error { color: var(--red); }
.thought-icon { width: 16px; flex-shrink: 0; text-align: center; }
.thought-text { flex: 1; line-height: 1.5; }

/* Streaming cursor */
.streaming-cursor { display: inline-block; width: 2px; height: 16px; background: var(--accent); animation: blink .8s infinite; margin-left: 2px; vertical-align: middle; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* Input */
#input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 8px; align-items: flex-end; }
#message-input { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; line-height: 1.5; max-height: 200px; outline: none; }
#message-input:focus { border-color: var(--accent); }
#send-button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
#send-button:hover { opacity: .85; }
#send-button:disabled { opacity: .4; cursor: not-allowed; }

/* File viewer */
#file-viewer { position: fixed; top: 0; right: 0; width: 500px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; transform: translateX(100%); transition: transform .3s; }
#file-viewer.open { transform: translateX(0); }
.file-viewer-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.file-viewer-header .title { font-size: 14px; font-weight: 600; }
#file-viewer-content { flex: 1; padding: 16px; background: var(--bg); border: none; color: var(--text); font-size: 13px; font-family: 'SF Mono', Consolas, monospace; line-height: 1.6; resize: none; outline: none; }
#save-file-button { margin: 12px 16px; padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
#save-file-button:hover { opacity: .85; }
#save-status { margin: 0 16px 12px; font-size: 12px; color: var(--green); display: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* System panel */
#system-panel { position: fixed; top: 0; right: 0; width: 380px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 100; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s; }
#system-panel.open { transform: translateX(0); }
.system-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.system-panel-content { padding: 16px; overflow-y: auto; flex: 1; }
.system-section { margin-bottom: 20px; }
.system-section h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 8px; }
.system-stats { font-size: 13px; line-height: 1.8; }
.system-stats .stat { display: flex; justify-content: space-between; }
.system-stats .stat-value { color: var(--text-dim); }
.system-btn { display: block; width: 100%; padding: 8px 12px; margin-bottom: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; text-align: left; }
.system-btn:hover { border-color: var(--accent); }
.system-btn.danger { border-color: var(--red); color: var(--red); }
.system-btn.danger:hover { background: var(--red); color: #fff; }

@media (max-width: 768px) {
  #sidebar { position: fixed; left: 0; top: 0; height: 100vh; z-index: 50; }
  #file-viewer { width: 100vw; }
  #system-panel { width: 100vw; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Felix</h2>
      <button class="icon-btn" id="close-sidebar">✕</button>
    </div>
    <div class="file-browser" id="file-browser">
      <div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">Loading...</div>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="chat-header">
      <button class="icon-btn" id="menu-button">☰</button>
      <span class="title">Felix</span>
      <button class="icon-btn" id="system-button">⚙</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="message-input" placeholder="Message Felix..." rows="1"></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <!-- File Viewer -->
  <div id="file-viewer">
    <div class="file-viewer-header">
      <span class="title" id="file-viewer-title"></span>
      <button class="icon-btn" id="close-file-viewer">✕</button>
    </div>
    <textarea id="file-viewer-content" spellcheck="false"></textarea>
    <div id="save-status">Saved</div>
    <button id="save-file-button">Save</button>
  </div>

  <!-- System Panel -->
  <div id="system-panel">
    <div class="system-panel-header">
      <span class="title">System</span>
      <button class="icon-btn" id="close-system-panel">✕</button>
    </div>
    <div class="system-panel-content" id="system-panel-content">
      <div class="system-section">
        <h3>Status</h3>
        <div class="system-stats" id="system-stats"></div>
      </div>
      <div class="system-section">
        <h3>Actions</h3>
        <button class="system-btn" onclick="triggerMaintenance()">Run Maintenance</button>
        <button class="system-btn" onclick="triggerScribe()">Run Scribe Consolidation</button>
        <button class="system-btn" onclick="triggerKnowledgeMaintenance()">Run Knowledge Maintenance</button>

        <button class="system-btn danger" onclick="triggerFactoryReset()">Factory Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- State ----
let streaming = false;
let currentThoughtDiv = null;
let currentMessageDiv = null;
let abortController = null;
let messageHistory = [];

// ---- DOM refs ----
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('message-input');
const sendBtn = document.getElementById('send-button');
const sidebar = document.getElementById('sidebar');
const fileBrowser = document.getElementById('file-browser');
const fileViewer = document.getElementById('file-viewer');
const fileViewerTitle = document.getElementById('file-viewer-title');
const fileViewerContent = document.getElementById('file-viewer-content');
const saveFileBtn = document.getElementById('save-file-button');
const saveStatus = document.getElementById('save-status');
const systemPanel = document.getElementById('system-panel');
const systemStats = document.getElementById('system-stats');

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
  loadHistory();
  loadFileTree();
  loadSystemStatus();
  inputEl.focus();
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);
document.getElementById('menu-button').addEventListener('click', () => sidebar.classList.toggle('hidden'));
document.getElementById('close-sidebar').addEventListener('click', () => sidebar.classList.add('hidden'));
document.getElementById('system-button').addEventListener('click', () => { systemPanel.classList.toggle('open'); loadSystemStatus(); });
document.getElementById('close-system-panel').addEventListener('click', () => systemPanel.classList.remove('open'));
document.getElementById('close-file-viewer').addEventListener('click', () => fileViewer.classList.remove('open'));

// ---- Markdown ----
function renderMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/### (.+)/g, '<h3>$1</h3>')
    .replace(/## (.+)/g, '<h2>$1</h2>')
    .replace(/# (.+)/g, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

// ---- History ----
async function loadHistory() {
  try {
    const r = await fetch('/chat/history/');
    const data = await r.json();
    messageHistory = data.messages || [];
    messagesEl.innerHTML = '';
    for (const msg of messageHistory) {
      appendMessage(msg.role, msg.content, false);
    }
    scrollToBottom();
  } catch (e) { console.error('History load error:', e); }
}

// ---- Append Message ----
function appendMessage(role, content, isStreaming = false) {
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const header = document.createElement('div');
  header.className = 'message-header';
  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = role === 'user' ? 'U' : 'F';
  const name = document.createElement('span');
  name.className = 'message-name';
  name.textContent = role === 'user' ? 'You' : 'Felix';
  header.appendChild(avatar);
  header.appendChild(name);
  div.appendChild(header);

  const contentDiv = document.createElement('div');
  contentDiv.className = 'message-content';
  if (isStreaming) {
    contentDiv.dataset.streaming = 'true';
  }
  contentDiv.innerHTML = content ? renderMarkdown(content) : '<span class="streaming-cursor"></span>';
  div.appendChild(contentDiv);

  if (role === 'assistant') {
    const thoughtDiv = document.createElement('div');
    thoughtDiv.className = 'thought-process';
    thoughtDiv.style.display = 'none';
    div.appendChild(thoughtDiv);
  }

  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function getOrCreateStreamingMessage() {
  const last = messagesEl.lastElementChild;
  if (last && last.classList.contains('assistant') && last.querySelector('.message-content[data-streaming]')) {
    return last;
  }
  const div = appendMessage('assistant', '', true);
  return div;
}

// ---- SSE Chat ----
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  streaming = true;
  sendBtn.disabled = true;

  appendMessage('user', text, false);
  const msgDiv = getOrCreateStreamingMessage();
  const contentDiv = msgDiv.querySelector('.message-content');
  const thoughtDiv = msgDiv.querySelector('.thought-process');

  currentThoughtDiv = thoughtDiv;
  currentMessageDiv = msgDiv;
  let aiText = '';
  let thoughtSteps = [];
  let thoughtVisible = false;

  function showThought(visible) {
    thoughtVisible = visible;
    thoughtDiv.style.display = visible ? 'block' : 'none';
  }

  function addThoughtStep(type, label, detail = '') {
    const id = 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    thoughtSteps.push(id);

    if (!thoughtDiv.querySelector('.thought-steps')) {
      thoughtDiv.innerHTML = '';
      const stepsDiv = document.createElement('div');
      stepsDiv.className = 'thought-steps';
      thoughtDiv.appendChild(stepsDiv);
    }

    const stepEl = document.createElement('div');
    stepEl.className = 'thought-step active';
    stepEl.id = id;
    const icons = { status: '⚙', context: '📄', retrieval: '🔍', history: '💬', synthesis: '🧠', error: '⚠' };
    stepEl.innerHTML = `<span class="thought-icon">${icons[type] || '•'}</span><span class="thought-text">${label}${detail ? '<br><span style="font-size:11px;color:var(--text-dim)">' + detail + '</span>' : ''}</span>`;
    thoughtDiv.querySelector('.thought-steps').appendChild(stepEl);
    showThought(true);
  }

  function completeStep(id) {
    const el = document.getElementById(id);
    if (el) { el.className = 'thought-step done'; }
  }

  function failStep(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.className = 'thought-step error'; el.querySelector('.thought-text').textContent += ' — ' + msg; }
  }

  try {
    const response = await fetch('/chat/api/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentEvent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n');
      buffer = parts.pop() || '';

      for (const line of parts) {
        const trimmed = line.trim();
        if (trimmed.startsWith('event: ')) {
          currentEvent = trimmed.slice(7).trim();
        } else if (trimmed.startsWith('data: ')) {
          try {
            const data = JSON.parse(trimmed.slice(6));
            handleSSEEvent(currentEvent, data, msgDiv, contentDiv, thoughtDiv, addThoughtStep, completeStep, failStep);
            if (currentEvent === 'token') {
              aiText += data.token || '';
              contentDiv.innerHTML = renderMarkdown(aiText) + '<span class="streaming-cursor"></span>';
              scrollToBottom();
            }
            if (currentEvent === 'done') {
              contentDiv.innerHTML = renderMarkdown(aiText);
              delete contentDiv.dataset.streaming;
              finalizeThoughts(thoughtDiv, thoughtSteps);
            }
          } catch (e) { /* skip malformed */ }
        }
      }
    }
  } catch (e) {
    contentDiv.innerHTML = renderMarkdown('Error: ' + e.message);
    delete contentDiv.dataset.streaming;
  }

  streaming = false;
  sendBtn.disabled = false;
  inputEl.focus();
  scrollToBottom();
}

function handleSSEEvent(event, data, msgDiv, contentDiv, thoughtDiv, addStep, completeStep, failStep) {
  if (event === 'thought') {
    const t = data.type || 'status';
    const summary = data.summary || data.message || '';
    const detail = data.content || data.query || '';
    const id = 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    thoughtDiv.style.display = 'block';
    addStep(t, summary, detail);
  }
}

function finalizeThoughts(thoughtDiv, stepIds) {
  for (const id of stepIds) {
    const el = document.getElementById(id);
    if (el) el.className = 'thought-step done';
  }
  if (!thoughtDiv.querySelector('.thought-header')) {
    const header = document.createElement('div');
    header.className = 'thought-header';
    header.innerHTML = `<span class="thought-toggle">▸</span><span class="thought-label">Reasoning — ${stepIds.length} steps</span>`;
    header.addEventListener('click', () => {
      const stepsContainer = thoughtDiv.querySelector('.thought-steps');
      const toggle = header.querySelector('.thought-toggle');
      if (stepsContainer) {
        const isOpen = stepsContainer.style.display !== 'none';
        stepsContainer.style.display = isOpen ? 'none' : 'block';
        toggle.classList.toggle('open', !isOpen);
      }
    });
    const existingSteps = thoughtDiv.querySelector('.thought-steps');
    thoughtDiv.insertBefore(header, existingSteps);
  }
  const toggle = thoughtDiv.querySelector('.thought-toggle');
  if (toggle) toggle.classList.remove('open');
  const stepsContainer = thoughtDiv.querySelector('.thought-steps');
  if (stepsContainer) stepsContainer.style.display = 'none';
}

// ---- File Browser ----
async function loadFileTree() {
  try {
    const r = await fetch('/api/files/');
    const data = await r.json();
    fileBrowser.innerHTML = '';
    renderTree(data.tree, fileBrowser);
  } catch (e) {
    fileBrowser.innerHTML = '<div style="padding:20px;color:var(--red);font-size:13px;">Failed to load files</div>';
  }
}

function renderTree(entries, parentEl, depth = 0) {
  for (const entry of entries) {
    if (entry.type === 'directory') {
      const cat = document.createElement('div');
      cat.className = 'file-category';
      const header = document.createElement('div');
      header.className = 'file-category-header';
      header.textContent = entry.name;
      header.style.paddingLeft = (8 + depth * 16) + 'px';
      const items = document.createElement('div');
      items.className = 'file-items';
      items.style.display = 'none';
      header.addEventListener('click', () => {
        items.style.display = items.style.display === 'none' ? 'block' : 'none';
      });
      cat.appendChild(header);
      cat.appendChild(items);
      parentEl.appendChild(cat);
      renderTree(entry.children || [], items, depth + 1);
    } else {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.textContent = entry.name;
      item.style.paddingLeft = (8 + depth * 16) + 'px';
      item.addEventListener('click', () => openFileViewer(entry.path));
      parentEl.appendChild(item);
    }
  }
}

async function openFileViewer(path) {
  fileViewerTitle.textContent = path;
  fileViewerContent.value = 'Loading...';
  fileViewerContent.dataset.path = path;
  fileViewer.classList.add('open');
  saveStatus.style.display = 'none';
  try {
    const r = await fetch('/api/files/read/' + encodeURIComponent(path) + '/');
    const data = await r.json();
    fileViewerContent.value = data.content || '';
  } catch (e) {
    fileViewerContent.value = 'Error loading file';
  }
}

saveFileBtn.addEventListener('click', async () => {
  const path = fileViewerContent.dataset.path;
  const content = fileViewerContent.value;
  try {
    const r = await fetch('/api/files/write/' + encodeURIComponent(path) + '/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    const data = await r.json();
    if (data.status === 'saved') {
      saveStatus.style.display = 'block';
      setTimeout(() => { saveStatus.style.display = 'none'; }, 2000);
    }
  } catch (e) { alert('Save failed'); }
});

// ---- System Panel ----
async function loadSystemStatus() {
  try {
    const r = await fetch('/system/status/');
    const data = await r.json();
    systemStats.innerHTML = `
      <div class="stat"><span>Messages</span><span class="stat-value">${data.message_count || 0}</span></div>
      <div class="stat"><span>Memory Chunks</span><span class="stat-value">${data.chunk_count || 0}</span></div>
      <div class="stat"><span>Projects</span><span class="stat-value">${data.project_count || 0}</span></div>

      <div class="stat"><span>Personality</span><span class="stat-value">${data.personality_evolved ? '✓' : '✗'}</span></div>
      <div class="stat"><span>Profile</span><span class="stat-value">${data.profile_filled ? '✓' : '✗'}</span></div>
    `;
  } catch (e) { systemStats.innerHTML = '<div style="color:var(--red)">Failed to load</div>'; }
}

async function triggerMaintenance() {
  await fetch('/system/maintenance/', { method: 'POST' });
  loadSystemStatus();
}
async function triggerScribe() {
  await fetch('/system/trigger-scribe/', { method: 'POST' });
}
async function triggerKnowledgeMaintenance() {
  await fetch('/system/knowledge-maintenance/', { method: 'POST' });
}
async function triggerFactoryReset() {
  if (!confirm('This will delete ALL data — chats, memories, personality, user profile, knowledge files, and project docs. This cannot be undone. Continue?')) return;
  if (!confirm('Are you absolutely sure? This is a complete factory reset.')) return;
  try {
    await fetch('/system/purge/', { method: 'POST' });
    messagesEl.innerHTML = '';
    messageHistory = [];
    loadSystemStatus();
    loadFileTree();
  } catch (e) {
    alert('Factory reset failed: ' + e.message);
  }
}


// ---- Utils ----
function scrollToBottom() {
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 10);
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});
</script>
